# 通用安全响应头（被 nginx.conf 用 include 引入）。
#
# 注意：nginx 的 add_header 是「覆盖式继承」——只要某个 location 里出现了任意
# 一条 add_header，它就不再继承上一层的 add_header。因此每个带 add_header 的
# location 都必须显式 include 本文件，否则会静默丢掉安全头。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP：脚本只允许同源产物；图片允许同源 / data: / https:（封面与头像可填外链）；
# style 放开 'unsafe-inline' 以兼容运行时注入样式的库。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'" always;
