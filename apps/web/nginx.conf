server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 上传图片最大 5MB，留一点余量避免 413 出现在 Nginx 层
  client_max_body_size 6m;

  # 压缩静态资源
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 带指纹的静态资源可长缓存。
  # 注意：不要再叠加 expires 指令 —— 它自身就会产出 Cache-Control: max-age=...，
  # 与下面的 add_header 一起会变成两条 Cache-Control（其中一条覆盖另一条）。
  # 注意 ^~ ：本 server 后面有一条正则 location（拦截带扩展名的静态请求），
  # 正则的优先级高于普通前缀 location；加 ^~ 才能让 /assets/ 不被它截走。
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # 后端 API
  location ^~ /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # 上传的图片由后端静态托管，这里一并反代。
  # 用户上传内容属于不可信输入：即使上传校验被绕过，nosniff + sandbox CSP 也能
  # 阻止内容被当作 HTML/脚本执行（存储型 XSS 的最后一道闸门）。
  location ^~ /uploads/ {
    proxy_pass http://api:3000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # 带扩展名的静态请求（/foo.png、/main.js …）必须真实存在。
  # 否则会落到下面的 SPA 回退里，用 index.html 顶替造成「软 404」（HTTP 200）。
  # 页面路由（/post/xxx、/category/xxx）不带扩展名，不受影响。
  location ~* \.[a-z0-9]+$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
